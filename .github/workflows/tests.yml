name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Compile application modules
        run: >-
          python -m py_compile app.py
          uc_admissions/admission_models.py uc_admissions/benchmark.py
          uc_admissions/benchmark_ui.py uc_admissions/dashboard_charts.py
          uc_admissions/ethnicity_analysis.py uc_admissions/gemini.py
          archive/analysis.py archive/gemini_adapter.py archive/profile.py
